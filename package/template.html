<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Stunt Car Racer for Lovers</title>
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon256.png" type="image/png">
    <style type="text/css">
      html, body {
        margin: 0;
      }
      .emscripten {
        width: 100%;
        height: 100%;
        display: flex;
        position: absolute;
        align-items: center;
        justify-content: center;
      }
      .game {
        width: 100%;
        height: 100%;
        display: block;
      }
      .loading {
        position: absolute;
      }
      .game[width] + .loading {
        display: none;
      }

    </style>
  </head>
  <body>
    <div class="emscripten">
      <canvas id="canvas" class="game" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
      <div class="loading">Loading...</div>
    </div>
    <script type="text/javascript">
        (function() {
            if (!screen || !screen.orientation || typeof screen.orientation.lock !== 'function') return;
            var orientationLock = screen.orientation.lock.bind(screen.orientation);
            screen.orientation.lock = function() {
                try {
                    var result = orientationLock.apply(null, arguments);
                    if (result && typeof result.catch === 'function') {
                        return result.catch(function() {});
                    }
                    return result;
                } catch (e) {
                    return Promise.resolve();
                }
            };
        })();

        function sanitizeWebArguments(args) {
            var allowedFlags = {
                '-f': 1,
                '--fullscreen': 1,
                '-d': 1,
                '--desktop': 1,
                '-n': 1,
                '--nomsaa': 1,
                '-w': 1,
                '--width': 1,
                '-h': 1,
                '--height': 1,
                '-s': 1,
                '--scale': 1
            };
            var valueFlags = { '-w': 1, '--width': 1, '-h': 1, '--height': 1, '-s': 1, '--scale': 1 };
            var clean = [];
            args = args || [];
            for (var i = 0; i < args.length; i++) {
                var arg = String(args[i] || '');
                if (!allowedFlags[arg]) continue;
                clean.push(arg);
                if (valueFlags[arg] && i + 1 < args.length) clean.push(String(args[++i]));
            }
            return clean;
        }

        const $game = document.querySelector('.game');
        function focusGameCanvas() {
            const canvas = document.getElementById('canvas');
            if (!canvas) return;
            var active = document.activeElement;
            if (active && /^(INPUT|TEXTAREA|SELECT|BUTTON|A)$/i.test(active.tagName || '')) return;
            try {
                canvas.focus({ preventScroll: true });
            } catch (e) {
                try { canvas.focus(); } catch (ignored) {}
            }
        }
        function resize() {
            const canvas = document.getElementById('canvas');
            if (!canvas || typeof Module === 'undefined' || !Module.canvas) return;
            const w = Math.max(1, window.innerWidth);
            const h = Math.max(1, window.innerHeight);
            if (canvas.width !== w || canvas.height !== h) {
                canvas.width = w;
                canvas.height = h;
            }
        }
        function isKeyboardControlTarget(target) {
            var el = target || document.activeElement;
            return !!(el && /^(INPUT|TEXTAREA|SELECT|BUTTON|A)$/i.test(el.tagName || ''));
        }
        // SDL2 keycode values for the native control keys handled by SetWebKeyboardKey().
        var SDL_WEB_KEYS = {
            ArrowLeft: 1073741904,
            ArrowRight: 1073741903,
            ArrowUp: 1073741906,
            ArrowDown: 1073741905,
            Space: 32,
            ShiftLeft: 1073742049,
            ShiftRight: 1073742053
        };
        function sdlKeyFromWebEvent(e) {
            if (e.key === 'ArrowLeft') return SDL_WEB_KEYS.ArrowLeft;
            if (e.key === 'ArrowRight') return SDL_WEB_KEYS.ArrowRight;
            if (e.key === 'ArrowUp') return SDL_WEB_KEYS.ArrowUp;
            if (e.key === 'ArrowDown') return SDL_WEB_KEYS.ArrowDown;
            if (e.code === 'Space' || e.key === ' ' || e.key === 'Spacebar') return SDL_WEB_KEYS.Space;
            if (e.code === 'ShiftLeft') return SDL_WEB_KEYS.ShiftLeft;
            if (e.code === 'ShiftRight') return SDL_WEB_KEYS.ShiftRight;
            if (e.key === 'Shift') return e.location === KeyboardEvent.DOM_KEY_LOCATION_RIGHT ? SDL_WEB_KEYS.ShiftRight : SDL_WEB_KEYS.ShiftLeft;
            switch (e.keyCode || e.which || 0) {
            case 37:
            case 63234:
                return SDL_WEB_KEYS.ArrowLeft;
            case 39:
            case 63235:
                return SDL_WEB_KEYS.ArrowRight;
            case 38:
            case 63232:
                return SDL_WEB_KEYS.ArrowUp;
            case 40:
            case 63233:
                return SDL_WEB_KEYS.ArrowDown;
            case 32:
                return SDL_WEB_KEYS.Space;
            case 16:
                return e.location === KeyboardEvent.DOM_KEY_LOCATION_RIGHT ? SDL_WEB_KEYS.ShiftRight : SDL_WEB_KEYS.ShiftLeft;
            }
            return 0;
        }
        function bridgeWebKeyboardEvent(e, pressed) {
            if (isKeyboardControlTarget(e.target)) return false;
            var sdlKey = sdlKeyFromWebEvent(e);
            if (!sdlKey) return false;
            focusGameCanvas();
            if (typeof Module !== 'undefined' && Module.calledRun && Module._SetWebKeyboardKey) Module._SetWebKeyboardKey(sdlKey, pressed ? 1 : 0);
            e.preventDefault();
            return true;
        }
        var Module = {
            print(text) {
                console.log(Array.prototype.slice.call(arguments).join(' '));
            },
            printErr() {
                console.error(Array.prototype.slice.call(arguments).join(' '));
            },
            canvas: document.getElementById('canvas') || $game,
            noStdioInit: true,
            arguments: sanitizeWebArguments([])
        };
        // Keep itch.io / unknown query params out of argv; the native parser only accepts game flags.
        (Module.preRun = Module.preRun || []).push(function() {
            Module['arguments'] = sanitizeWebArguments(Module['arguments']);
        });
        window.addEventListener('resize', resize, false);
        window.triggerResize = resize;
        ['pointerdown', 'mousedown', 'touchstart'].forEach(function(type) {
            document.addEventListener(type, function() { setTimeout(focusGameCanvas, 0); }, true);
        });
        ['focus', 'pageshow', 'fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function(type) {
            window.addEventListener(type, function() {
                setTimeout(focusGameCanvas, 0);
                setTimeout(focusGameCanvas, 250);
            }, true);
            document.addEventListener(type, function() {
                setTimeout(focusGameCanvas, 0);
                setTimeout(focusGameCanvas, 250);
            }, true);
        });
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) return;
            setTimeout(focusGameCanvas, 0);
            setTimeout(focusGameCanvas, 250);
        }, true);
        document.addEventListener('keydown', function(e) { bridgeWebKeyboardEvent(e, true); }, { passive: false, capture: true });
        document.addEventListener('keyup', function(e) { bridgeWebKeyboardEvent(e, false); }, { passive: false, capture: true });
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() { resize(); focusGameCanvas(); });
        } else {
            resize();
            focusGameCanvas();
        }
        // Work-around chromium autoplay policy
        // https://github.com/emscripten-core/emscripten/issues/6511
        function resumeAudio(e) {
            if (typeof Module === 'undefined'
                || typeof Module.SDL2 == 'undefined'
                || typeof Module.SDL2.audioContext == 'undefined')
                return;
            if (Module.SDL2.audioContext.state == 'suspended') {
                Module.SDL2.audioContext.resume();
            }
            if (Module.SDL2.audioContext.state == 'running') {
                $game.removeEventListener('click', resumeAudio);
                document.removeEventListener('keydown', resumeAudio);
            }
        }
        $game.addEventListener('click', resumeAudio);
        document.addEventListener('keydown', resumeAudio);

    </script>
    {{{ SCRIPT }}}
  </body>
</html>
