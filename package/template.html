<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Stunt Car Racer for Lovers</title>
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon256.png" type="image/png">
    <style type="text/css">
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }
      .emscripten {
        width: 100%;
        height: 100%;
        display: flex;
        position: absolute;
        align-items: center;
        justify-content: center;
      }
      .game {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        touch-action: none;
      }
      .loading {
        position: absolute;
      }
      .game[width] + .loading {
        display: none;
      }

    </style>
  </head>
  <body>
    <div class="emscripten">
      <canvas id="canvas" class="game" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
      <div class="loading">Loading...</div>
    </div>
    <script type="text/javascript">
        (function() {
            if (!screen || !screen.orientation || typeof screen.orientation.lock !== 'function') return;
            var orientationLock = screen.orientation.lock.bind(screen.orientation);
            screen.orientation.lock = function() {
                try {
                    var result = orientationLock.apply(null, arguments);
                    if (result && typeof result.catch === 'function') {
                        return result.catch(function() {});
                    }
                    return result;
                } catch (e) {
                    return Promise.resolve();
                }
            };
        })();

        function sanitizeWebArguments(args) {
            var allowedFlags = {
                '-f': 1,
                '--fullscreen': 1,
                '-d': 1,
                '--desktop': 1,
                '-n': 1,
                '--nomsaa': 1,
                '-w': 1,
                '--width': 1,
                '-h': 1,
                '--height': 1,
                '-s': 1,
                '--scale': 1
            };
            var valueFlags = { '-w': 1, '--width': 1, '-h': 1, '--height': 1, '-s': 1, '--scale': 1 };
            var clean = [];
            args = args || [];
            for (var i = 0; i < args.length; i++) {
                var arg = String(args[i] || '');
                if (!allowedFlags[arg]) continue;
                clean.push(arg);
                if (valueFlags[arg] && i + 1 < args.length) clean.push(String(args[++i]));
            }
            return clean;
        }

        const $game = document.querySelector('.game');
        function focusGameCanvas() {
            const canvas = document.getElementById('canvas');
            if (!canvas) return;
            var active = document.activeElement;
            if (active && /^(INPUT|TEXTAREA|SELECT|BUTTON|A)$/i.test(active.tagName || '')) return;
            try {
                canvas.focus({ preventScroll: true });
            } catch (e) {
                try { canvas.focus(); } catch (ignored) {}
            }
        }
        function resize() {
            const canvas = document.getElementById('canvas');
            if (!canvas || typeof Module === 'undefined' || !Module.canvas) return;
            const w = Math.max(1, window.innerWidth);
            const h = Math.max(1, window.innerHeight);
            if (canvas.width !== w || canvas.height !== h) {
                canvas.width = w;
                canvas.height = h;
            }
        }
        function isKeyboardControlTarget(target) {
            var el = target || document.activeElement;
            return !!(el && /^(INPUT|TEXTAREA|SELECT|BUTTON|A)$/i.test(el.tagName || ''));
        }
        // SDL2 keycode values for the native control keys handled by SetWebKeyboardKey().
        var SDL_WEB_KEYS = {
            ArrowLeft: 1073741904,
            ArrowRight: 1073741903,
            ArrowUp: 1073741906,
            ArrowDown: 1073741905,
            Enter: 13,
            Space: 32,
            ShiftLeft: 1073742049,
            ShiftRight: 1073742053
        };
        function isWebArrowEvent(e) {
            var key = e.key || '';
            var code = e.code || '';
            return key === 'ArrowLeft' || key === 'ArrowRight' || key === 'ArrowUp' || key === 'ArrowDown'
                || key === 'Left' || key === 'Right' || key === 'Up' || key === 'Down'
                || key === 'UIKeyInputLeftArrow' || key === 'UIKeyInputRightArrow'
                || key === 'UIKeyInputUpArrow' || key === 'UIKeyInputDownArrow'
                || code === 'ArrowLeft' || code === 'ArrowRight' || code === 'ArrowUp' || code === 'ArrowDown';
        }
        function sdlKeyFromWebEvent(e) {
            var key = e.key || '';
            var code = e.code || '';
            // Prefer code: Safari/WebKit often reports built-in arrows with location=numpad
            // and a less reliable key/keyCode than Chrome.
            if (code === 'ArrowLeft' || key === 'ArrowLeft' || key === 'Left' || key === 'UIKeyInputLeftArrow')
                return SDL_WEB_KEYS.ArrowLeft;
            if (code === 'ArrowRight' || key === 'ArrowRight' || key === 'Right' || key === 'UIKeyInputRightArrow')
                return SDL_WEB_KEYS.ArrowRight;
            if (code === 'ArrowUp' || key === 'ArrowUp' || key === 'Up' || key === 'UIKeyInputUpArrow')
                return SDL_WEB_KEYS.ArrowUp;
            if (code === 'ArrowDown' || key === 'ArrowDown' || key === 'Down' || key === 'UIKeyInputDownArrow')
                return SDL_WEB_KEYS.ArrowDown;
            if (code === 'Enter' || code === 'NumpadEnter' || key === 'Enter' || key === 'Return')
                return SDL_WEB_KEYS.Enter;
            if (code === 'Space' || key === ' ' || key === 'Spacebar') return SDL_WEB_KEYS.Space;
            if (code === 'ShiftLeft') return SDL_WEB_KEYS.ShiftLeft;
            if (code === 'ShiftRight') return SDL_WEB_KEYS.ShiftRight;
            if (key === 'Shift') return e.location === KeyboardEvent.DOM_KEY_LOCATION_RIGHT ? SDL_WEB_KEYS.ShiftRight : SDL_WEB_KEYS.ShiftLeft;
            switch (e.keyCode || e.which || 0) {
            case 37:
            case 63234:
                return SDL_WEB_KEYS.ArrowLeft;
            case 39:
            case 63235:
                return SDL_WEB_KEYS.ArrowRight;
            case 38:
            case 63232:
                return SDL_WEB_KEYS.ArrowUp;
            case 40:
            case 63233:
                return SDL_WEB_KEYS.ArrowDown;
            case 13:
                return SDL_WEB_KEYS.Enter;
            case 32:
                return SDL_WEB_KEYS.Space;
            case 16:
                return e.location === KeyboardEvent.DOM_KEY_LOCATION_RIGHT ? SDL_WEB_KEYS.ShiftRight : SDL_WEB_KEYS.ShiftLeft;
            }
            return 0;
        }
        function pushWebKeyboardKey(sdlKey, pressed) {
            if (typeof Module === 'undefined' || !Module.calledRun || !Module._SetWebKeyboardKey) return;
            Module._SetWebKeyboardKey(sdlKey, pressed ? 1 : 0);
        }
        function bridgeWebKeyboardEvent(e, pressed) {
            if (e._scrWebKeyBridged) return false;
            if (isKeyboardControlTarget(e.target)) return false;
            var sdlKey = sdlKeyFromWebEvent(e);
            if (!sdlKey) return false;
            e._scrWebKeyBridged = true;
            focusGameCanvas();
            pushWebKeyboardKey(sdlKey, pressed);
            if (e.cancelable) e.preventDefault();
            return true;
        }
        // Safari/WebKit: laptop arrow keys often arrive with location=3 (numpad). Emscripten/SDL
        // ignores those for direction input; remap to location 0 and feed our bridge directly.
        (function installSafariArrowRemap() {
            var ua = navigator.userAgent || '';
            if (!/AppleWebKit/i.test(ua) || /Chrome|Chromium|Edg\//i.test(ua)) return;
            function synthesizeArrowWithLocation0(orig) {
                try {
                    var ev = new KeyboardEvent(orig.type, {
                        key: orig.key,
                        code: orig.code,
                        location: 0,
                        repeat: orig.repeat,
                        ctrlKey: orig.ctrlKey,
                        shiftKey: orig.shiftKey,
                        altKey: orig.altKey,
                        metaKey: orig.metaKey,
                        bubbles: true,
                        cancelable: true
                    });
                    try {
                        Object.defineProperty(ev, 'which', { get: function() { return orig.which; } });
                        Object.defineProperty(ev, 'keyCode', { get: function() { return orig.keyCode; } });
                    } catch (ignored) {}
                    ev._scrWebKeyBridged = false;
                    return ev;
                } catch (err) {
                    return null;
                }
            }
            function remapArrowLocationCapture(e) {
                if (!isWebArrowEvent(e)) return;
                if (e.cancelable) e.preventDefault();
                // DOM_KEY_LOCATION_NUMPAD is 3; some WebKit builds also use 4 for laptop arrows.
                if (e.location !== 3 && e.location !== 4) return;
                var pressed = (e.type === 'keydown');
                var sdlKey = sdlKeyFromWebEvent(e);
                if (sdlKey) {
                    e._scrWebKeyBridged = true;
                    focusGameCanvas();
                    pushWebKeyboardKey(sdlKey, pressed);
                }
                var syn = synthesizeArrowWithLocation0(e);
                if (!syn) return;
                e.stopImmediatePropagation();
                var target = document.getElementById('canvas') || e.target || document;
                target.dispatchEvent(syn);
            }
            document.addEventListener('keydown', remapArrowLocationCapture, true);
            document.addEventListener('keyup', remapArrowLocationCapture, true);
        })();
        var Module = {
            print(text) {
                console.log(Array.prototype.slice.call(arguments).join(' '));
            },
            printErr() {
                console.error(Array.prototype.slice.call(arguments).join(' '));
            },
            canvas: document.getElementById('canvas') || $game,
            noStdioInit: true,
            arguments: sanitizeWebArguments([])
        };
        // Keep itch.io / unknown query params out of argv; the native parser only accepts game flags.
        (Module.preRun = Module.preRun || []).push(function() {
            Module['arguments'] = sanitizeWebArguments(Module['arguments']);
        });
        window.addEventListener('resize', resize, false);
        window.triggerResize = resize;
        ['pointerdown', 'mousedown', 'touchstart'].forEach(function(type) {
            document.addEventListener(type, function() { setTimeout(focusGameCanvas, 0); }, true);
        });
        ['focus', 'pageshow', 'fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function(type) {
            window.addEventListener(type, function() {
                setTimeout(focusGameCanvas, 0);
                setTimeout(focusGameCanvas, 250);
            }, true);
            document.addEventListener(type, function() {
                setTimeout(focusGameCanvas, 0);
                setTimeout(focusGameCanvas, 250);
            }, true);
        });
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) return;
            setTimeout(focusGameCanvas, 0);
            setTimeout(focusGameCanvas, 250);
        }, true);
        function onWebKeyDown(e) { bridgeWebKeyboardEvent(e, true); }
        function onWebKeyUp(e) { bridgeWebKeyboardEvent(e, false); }
        document.addEventListener('keydown', onWebKeyDown, { passive: false, capture: true });
        document.addEventListener('keyup', onWebKeyUp, { passive: false, capture: true });
        window.addEventListener('keydown', onWebKeyDown, { passive: false, capture: true });
        window.addEventListener('keyup', onWebKeyUp, { passive: false, capture: true });
        if ($game) {
            $game.addEventListener('keydown', onWebKeyDown, { passive: false });
            $game.addEventListener('keyup', onWebKeyUp, { passive: false });
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() { resize(); focusGameCanvas(); });
        } else {
            resize();
            focusGameCanvas();
        }
        // Work-around chromium autoplay policy
        // https://github.com/emscripten-core/emscripten/issues/6511
        window.__scrMusicQueue = [];
        function queueScrMusic(method, args) {
            if (window.SCRWebMusic && window.SCRWebMusic.__ready) {
                var fn = window.SCRWebMusic[method];
                if (typeof fn === 'function') return fn.apply(window.SCRWebMusic, args);
            }
            window.__scrMusicQueue.push({ method: method, args: args });
        }
        window.SCRWebMusic = {
            __ready: false,
            init: function() { queueScrMusic('init', []); return Promise.resolve(); },
            shutdown: function() { queueScrMusic('shutdown', []); },
            setGameMode: function(mode) { queueScrMusic('setGameMode', [mode]); },
            isMenuMusicEnabled: function() {
                if (window.SCRWebMusic.__ready && typeof window.SCRWebMusic._isMenuMusicEnabled === 'function')
                    return window.SCRWebMusic._isMenuMusicEnabled();
                return true;
            },
            setMenuMusicEnabled: function(on) { queueScrMusic('setMenuMusicEnabled', [on]); },
            resumeAudioContext: function() {
                if (window.SCRWebMusic.__ready && typeof window.SCRWebMusic._resumeAudioContext === 'function')
                    return window.SCRWebMusic._resumeAudioContext();
                return Promise.resolve();
            },
            onAudioUnlocked: function() {
                if (window.SCRWebMusic.__ready && typeof window.SCRWebMusic.onAudioUnlocked === 'function')
                    return window.SCRWebMusic.onAudioUnlocked();
                queueScrMusic('onAudioUnlocked', []);
                return Promise.resolve();
            }
        };

        function resumeAudio(e) {
            if (typeof Module === 'undefined'
                || typeof Module.SDL2 == 'undefined'
                || typeof Module.SDL2.audioContext == 'undefined')
                return;
            var ctx = Module.SDL2.audioContext;
            function unlockMusic() {
                if (typeof SCRWebMusic !== 'undefined') {
                    if (SCRWebMusic.resumeAudioContext) SCRWebMusic.resumeAudioContext();
                    if (SCRWebMusic.onAudioUnlocked) SCRWebMusic.onAudioUnlocked();
                }
                if (ctx.state === 'running') {
                    $game.removeEventListener('click', resumeAudio);
                    document.removeEventListener('keydown', resumeAudio);
                }
            }
            if (ctx.state === 'suspended') {
                ctx.resume().then(unlockMusic).catch(unlockMusic);
            } else {
                unlockMusic();
            }
        }
        $game.addEventListener('click', resumeAudio);
        document.addEventListener('keydown', resumeAudio);

    </script>
    <script type="module" src="web-music.js"></script>
    {{{ SCRIPT }}}
  </body>
</html>
