name: Publish Mac Windows Web and Pages

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-pages
  cancel-in-progress: true

jobs:
  build-mac:
    name: Build macOS Apple Silicon DMG
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout psgplay
        uses: actions/checkout@v5
        with:
          repository: frno7/psgplay
          path: retro-music-player/tools/psgplay
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package .app DMG
        run: |
          chmod +x scripts/package-macos-app.sh
          mkdir -p dist
          ./scripts/package-macos-app.sh \
            build/stuntcarracer \
            data \
            dist \
            arm64
          file dist/StuntCarRacerForLovers-macOS-arm64.dmg
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mac-arm64-dmg
          path: dist/StuntCarRacerForLovers-macOS-arm64.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows x64 ZIP
    if: false # temporarily disabled
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSYS2 MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            make

      - name: Checkout psgplay
        uses: actions/checkout@v5
        with:
          repository: frno7/psgplay
          path: retro-music-player/tools/psgplay
          submodules: recursive

      - name: Build libpsgplay
        working-directory: ${{ github.workspace }}
        run: |
          test -f retro-music-player/tools/psgplay/Makefile
          make -C retro-music-player/tools/psgplay lib/psgplay/libpsgplay.a

      - name: Configure
        env:
          PSGPLAY_DIR: ${{ github.workspace }}/retro-music-player/tools/psgplay
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -G "MinGW Makefiles"

      - name: Build
        run: cmake --build build --parallel 4

      - name: Locate executable
        id: exe
        run: |
          exe="$(find build -name stuntcarracer.exe | head -1)"
          if [ -z "$exe" ]; then
            echo "stuntcarracer.exe not found under build/"
            exit 1
          fi
          echo "path=$exe" >> "$GITHUB_OUTPUT"
          ls -lh "$exe"

      - name: Package ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          ./scripts/package-windows-zip.ps1 `
            -Binary "${{ steps.exe.outputs.path }}" `
            -DataDir data `
            -OutDir dist `
            -ArchLabel x64 `
            -MinGwBin "C:/msys64/ucrt64/bin"
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-zip
          path: dist/StuntCarRacerForLovers-Windows-x64.zip
          if-no-files-found: error

  build-web:
    name: Build Web (Emscripten)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 3.1.74
          actions-cache-folder: emsdk-cache

      - name: Verify emcc
        run: emcc -v

      - name: Vendor ym2149-wasm
        run: |
          chmod +x scripts/vendor-ym2149-wasm.sh
          ./scripts/vendor-ym2149-wasm.sh

      - name: Configure
        run: emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-web --config Release --parallel 4

      - name: Collect playable files
        run: |
          set -euo pipefail
          mkdir -p web-dist
          for f in stuntcarracer.html stuntcarracer.js stuntcarracer.wasm stuntcarracer.data \
                   stuntcarracer.wasm.map icon.png icon256.png; do
            if [[ -f "build-web/${f}" ]]; then
              cp "build-web/${f}" web-dist/
            fi
          done
          cp web-dist/stuntcarracer.html web-dist/index.html
          mkdir -p web-dist/ym2149 web-dist/data/Music
          cp package/ym2149/ym2149_wasm.js package/ym2149/ym2149_wasm_bg.wasm web-dist/ym2149/
          cp package/web-music.js web-dist/
          cp -R data/Music/. web-dist/data/Music/
          ls -lh web-dist web-dist/ym2149 web-dist/data/Music

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-play
          path: web-dist/
          if-no-files-found: error

  pages:
    name: Deploy GitHub Pages
    needs: [build-mac, build-web]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Mac DMG
        uses: actions/download-artifact@v8
        with:
          name: mac-arm64-dmg
          path: artifacts/mac

      - name: Download Web build
        uses: actions/download-artifact@v8
        with:
          name: web-play
          path: artifacts/web

      - name: Assemble site
        run: |
          set -euo pipefail
          SITE_OUT=_site
          mkdir -p "${SITE_OUT}/download" "${SITE_OUT}/assets" "${SITE_OUT}/play"
          cp site/index.html "${SITE_OUT}/"
          cp site/llms.txt site/robots.txt site/sitemap.xml "${SITE_OUT}/"
          touch "${SITE_OUT}/.nojekyll"
          cp -R site/assets/. "${SITE_OUT}/assets/"
          cp data/Bitmap/icon.png "${SITE_OUT}/assets/icon.png"
          cp package/icon256.png "${SITE_OUT}/assets/icon256.png" 2>/dev/null || true
          cp artifacts/mac/*.dmg "${SITE_OUT}/download/"
          cp -R artifacts/web/. "${SITE_OUT}/play/"

          SHA="$(git rev-parse --short HEAD)"
          BUILT_AT="$(date -u +%Y-%m-%d)"
          python3 - <<PY
          import json, pathlib
          out = pathlib.Path("_site/download/latest.json")
          out.write_text(json.dumps({
            "version": "${SHA}",
            "built_at": "${BUILT_AT}",
            "arm64": "download/StuntCarRacerForLovers-macOS-arm64.dmg",
            "dmg": "download/StuntCarRacerForLovers-macOS-arm64.dmg",
            "play": "play/",
          }, indent=2) + "\n")
          PY
          echo "=== site tree ==="
          find "${SITE_OUT}" -maxdepth 3 -type f | sort
          ls -lh "${SITE_OUT}/play" "${SITE_OUT}/download"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

  release:
    name: Attach builds to release (tags only)
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-mac, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Download Mac DMG
        uses: actions/download-artifact@v8
        with:
          name: mac-arm64-dmg
          path: artifacts/mac

      - name: Download Web build
        uses: actions/download-artifact@v8
        with:
          name: web-play
          path: artifacts/web

      - name: Zip web play bundle
        run: |
          cd artifacts/web
          zip -r ../StuntCarRacerForLovers-web.zip .
          ls -lh ../StuntCarRacerForLovers-web.zip artifacts/mac/

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/mac/*.dmg
            artifacts/StuntCarRacerForLovers-web.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
