name: Publish Mac Web and Pages

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-pages
  cancel-in-progress: true

jobs:
  build-mac:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package .app zip
        run: |
          chmod +x scripts/package-macos-app.sh
          mkdir -p dist
          ./scripts/package-macos-app.sh \
            build/stuntcarracer \
            data \
            dist \
            ${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: mac-${{ matrix.arch }}
          path: dist/StuntCarRacerForLovers-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error

  build-web:
    name: Build Web (Emscripten)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 3.1.74
          actions-cache-folder: emsdk-cache

      - name: Verify emcc
        run: emcc -v

      - name: Configure
        run: emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-web --config Release --parallel 4

      - name: Collect playable files
        run: |
          set -euo pipefail
          mkdir -p web-dist
          # Emscripten emits html/js/wasm + optional .data preload pack
          for f in stuntcarracer.html stuntcarracer.js stuntcarracer.wasm stuntcarracer.data \
                   stuntcarracer.wasm.map icon.png icon256.png; do
            if [[ -f "build-web/${f}" ]]; then
              cp "build-web/${f}" web-dist/
            fi
          done
          # Clean URL: /play/ loads the game
          cp web-dist/stuntcarracer.html web-dist/index.html
          ls -lh web-dist

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: web-play
          path: web-dist/
          if-no-files-found: error

  pages:
    name: Deploy GitHub Pages
    needs: [build-mac, build-web]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Mac zips
        uses: actions/download-artifact@v5
        with:
          pattern: mac-*
          path: artifacts/mac
          merge-multiple: true

      - name: Download Web build
        uses: actions/download-artifact@v5
        with:
          name: web-play
          path: artifacts/web

      - name: Assemble site
        run: |
          set -euo pipefail
          SITE_OUT=_site
          mkdir -p "${SITE_OUT}/download" "${SITE_OUT}/assets" "${SITE_OUT}/play"
          cp site/index.html "${SITE_OUT}/"
          touch "${SITE_OUT}/.nojekyll"
          cp data/Bitmap/icon.png "${SITE_OUT}/assets/icon.png"
          cp package/icon256.png "${SITE_OUT}/assets/icon256.png" 2>/dev/null || true
          cp artifacts/mac/*.zip "${SITE_OUT}/download/"
          cp -R artifacts/web/. "${SITE_OUT}/play/"

          SHA="$(git rev-parse --short HEAD)"
          BUILT_AT="$(date -u +%Y-%m-%d)"
          python3 - <<PY
          import json, pathlib
          out = pathlib.Path("_site/download/latest.json")
          out.write_text(json.dumps({
            "version": "${SHA}",
            "built_at": "${BUILT_AT}",
            "arm64": "download/StuntCarRacerForLovers-macOS-arm64.zip",
            "x86_64": "download/StuntCarRacerForLovers-macOS-x86_64.zip",
            "play": "play/",
          }, indent=2) + "\n")
          PY
          echo "=== site tree ==="
          find "${SITE_OUT}" -maxdepth 3 -type f | sort
          ls -lh "${SITE_OUT}/play" "${SITE_OUT}/download"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

  release:
    name: Attach Mac zips to release (tags only)
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-mac, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Download Mac zips
        uses: actions/download-artifact@v5
        with:
          pattern: mac-*
          path: artifacts/mac
          merge-multiple: true

      - name: Download Web build
        uses: actions/download-artifact@v5
        with:
          name: web-play
          path: artifacts/web

      - name: Zip web play bundle
        run: |
          cd artifacts/web
          zip -r ../StuntCarRacerForLovers-web.zip .
          ls -lh ../StuntCarRacerForLovers-web.zip

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/mac/*.zip
            artifacts/StuntCarRacerForLovers-web.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
