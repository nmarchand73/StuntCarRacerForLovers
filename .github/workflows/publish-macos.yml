name: Publish Mac Windows Web and Pages

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-pages
  cancel-in-progress: true

jobs:
  build-mac:
    name: Build macOS Apple Silicon DMG
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout psgplay (sparse)
        uses: actions/checkout@v5
        with:
          repository: nmarchand73/retro-music-player
          path: retro-music-player
          sparse-checkout: |
            tools/psgplay
          sparse-checkout-cone-mode: false

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package .app DMG
        run: |
          chmod +x scripts/package-macos-app.sh
          mkdir -p dist
          ./scripts/package-macos-app.sh \
            build/stuntcarracer \
            data \
            dist \
            arm64
          file dist/StuntCarRacerForLovers-macOS-arm64.dmg
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mac-arm64-dmg
          path: dist/StuntCarRacerForLovers-macOS-arm64.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows x64 ZIP
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSTUNT_ENABLE_PSGPLAY_MUSIC=OFF

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Locate executable
        id: exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter stuntcarracer.exe | Select-Object -First 1
          if (-not $exe) { throw "stuntcarracer.exe not found under build/" }
          "path=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Found $($exe.FullName)"

      - name: Package ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          ./scripts/package-windows-zip.ps1 `
            -Binary "${{ steps.exe.outputs.path }}" `
            -DataDir data `
            -OutDir dist `
            -ArchLabel x64
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-zip
          path: dist/StuntCarRacerForLovers-Windows-x64.zip
          if-no-files-found: error

  build-web:
    name: Build Web (Emscripten)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 3.1.74
          actions-cache-folder: emsdk-cache

      - name: Verify emcc
        run: emcc -v

      - name: Configure
        run: emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-web --config Release --parallel 4

      - name: Collect playable files
        run: |
          set -euo pipefail
          mkdir -p web-dist
          for f in stuntcarracer.html stuntcarracer.js stuntcarracer.wasm stuntcarracer.data \
                   stuntcarracer.wasm.map icon.png icon256.png; do
            if [[ -f "build-web/${f}" ]]; then
              cp "build-web/${f}" web-dist/
            fi
          done
          cp web-dist/stuntcarracer.html web-dist/index.html
          ls -lh web-dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-play
          path: web-dist/
          if-no-files-found: error

  pages:
    name: Deploy GitHub Pages
    needs: [build-mac, build-windows, build-web]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Mac DMG
        uses: actions/download-artifact@v8
        with:
          name: mac-arm64-dmg
          path: artifacts/mac

      - name: Download Windows ZIP
        uses: actions/download-artifact@v8
        with:
          name: windows-x64-zip
          path: artifacts/windows

      - name: Download Web build
        uses: actions/download-artifact@v8
        with:
          name: web-play
          path: artifacts/web

      - name: Assemble site
        run: |
          set -euo pipefail
          SITE_OUT=_site
          mkdir -p "${SITE_OUT}/download" "${SITE_OUT}/assets" "${SITE_OUT}/play"
          cp site/index.html "${SITE_OUT}/"
          cp site/llms.txt site/robots.txt site/sitemap.xml "${SITE_OUT}/"
          touch "${SITE_OUT}/.nojekyll"
          cp -R site/assets/. "${SITE_OUT}/assets/"
          cp data/Bitmap/icon.png "${SITE_OUT}/assets/icon.png"
          cp package/icon256.png "${SITE_OUT}/assets/icon256.png" 2>/dev/null || true
          cp artifacts/mac/*.dmg "${SITE_OUT}/download/"
          cp artifacts/windows/*.zip "${SITE_OUT}/download/"
          cp -R artifacts/web/. "${SITE_OUT}/play/"

          SHA="$(git rev-parse --short HEAD)"
          BUILT_AT="$(date -u +%Y-%m-%d)"
          python3 - <<PY
          import json, pathlib
          out = pathlib.Path("_site/download/latest.json")
          out.write_text(json.dumps({
            "version": "${SHA}",
            "built_at": "${BUILT_AT}",
            "arm64": "download/StuntCarRacerForLovers-macOS-arm64.dmg",
            "dmg": "download/StuntCarRacerForLovers-macOS-arm64.dmg",
            "windows": "download/StuntCarRacerForLovers-Windows-x64.zip",
            "windows_x64": "download/StuntCarRacerForLovers-Windows-x64.zip",
            "play": "play/",
          }, indent=2) + "\n")
          PY
          echo "=== site tree ==="
          find "${SITE_OUT}" -maxdepth 3 -type f | sort
          ls -lh "${SITE_OUT}/play" "${SITE_OUT}/download"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

  release:
    name: Attach builds to release (tags only)
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-mac, build-windows, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Download Mac DMG
        uses: actions/download-artifact@v8
        with:
          name: mac-arm64-dmg
          path: artifacts/mac

      - name: Download Windows ZIP
        uses: actions/download-artifact@v8
        with:
          name: windows-x64-zip
          path: artifacts/windows

      - name: Download Web build
        uses: actions/download-artifact@v8
        with:
          name: web-play
          path: artifacts/web

      - name: Zip web play bundle
        run: |
          cd artifacts/web
          zip -r ../StuntCarRacerForLovers-web.zip .
          ls -lh ../StuntCarRacerForLovers-web.zip artifacts/mac/ artifacts/windows/

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/mac/*.dmg
            artifacts/windows/*.zip
            artifacts/StuntCarRacerForLovers-web.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
