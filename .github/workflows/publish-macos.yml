name: Publish Mac + GitHub Pages

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-mac-pages
  cancel-in-progress: true

jobs:
  build-mac:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package .app zip
        run: |
          chmod +x scripts/package-macos-app.sh
          mkdir -p dist
          ./scripts/package-macos-app.sh \
            build/stuntcarracer \
            data \
            dist \
            ${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: dist/StuntCarRacerForLovers-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error

  pages:
    name: Deploy GitHub Pages
    needs: build-mac
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Mac zips
        uses: actions/download-artifact@v4
        with:
          pattern: mac-*
          path: artifacts
          merge-multiple: true

      - name: Assemble site
        run: |
          set -euo pipefail
          SITE_OUT=_site
          mkdir -p "${SITE_OUT}/download" "${SITE_OUT}/assets"
          cp site/index.html "${SITE_OUT}/"
          touch "${SITE_OUT}/.nojekyll"
          cp data/Bitmap/icon.png "${SITE_OUT}/assets/icon.png"
          cp package/icon256.png "${SITE_OUT}/assets/icon256.png" 2>/dev/null || true
          cp artifacts/*.zip "${SITE_OUT}/download/"

          SHA="$(git rev-parse --short HEAD)"
          BUILT_AT="$(date -u +%Y-%m-%d)"
          python3 - <<PY
          import json, pathlib
          out = pathlib.Path("_site/download/latest.json")
          out.write_text(json.dumps({
            "version": "${SHA}",
            "built_at": "${BUILT_AT}",
            "arm64": "download/StuntCarRacerForLovers-macOS-arm64.zip",
            "x86_64": "download/StuntCarRacerForLovers-macOS-x86_64.zip",
          }, indent=2) + "\n")
          PY
          ls -lhR "${SITE_OUT}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  release:
    name: Attach Mac zips to release (tags only)
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-mac
    runs-on: ubuntu-latest
    steps:
      - name: Download Mac zips
        uses: actions/download-artifact@v4
        with:
          pattern: mac-*
          path: artifacts
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
